# Stages the package on npm when a GitHub Release is published.
# A maintainer must then approve it (2FA) before it is installable:
#   npm stage list football-logos
#   npm stage approve <stage-id>
#
# How this works:
# 1. Bump `version` in package.json, commit, and push.
# 2. Create a GitHub Release whose tag is `v<that version>` (for example v0.2.0).
# 3. This workflow checks out the tagged commit, verifies package.json matches
#    the tag, then runs `npm stage publish --provenance --access public`.
#
# Auth: npm trusted publishing (OIDC). On npmjs.com, add this GitHub repo and
# this workflow filename as a trusted publisher with "npm stage publish" only.

name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - name: Check package version matches release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match package.json version '$PKG'."
            echo "Create the release from a commit whose package.json version is $TAG."
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - name: Stage publish
        run: npm stage publish --provenance --access public
